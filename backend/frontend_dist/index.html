<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NebulaDrive</title>
    <!-- 站点图标：SVG 优先（矢量清晰），ICO/PNG 兼容旧浏览器与各平台 -->
    <link rel="icon" type="image/svg+xml" href="/icons/nebula-drive-icon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="theme-color" content="#0C1528" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // 防止主题闪烁：在应用挂载前根据本地存储应用主题
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : true;
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <!-- 点阵加载动画：自包含 Web Component，挂载时自动注册为 <dot-motion-loader> -->
    <script defer src="/dot-motion-loader.js"></script>
    <script>
      // 注册 Service Worker：只缓存应用壳，不碰 API/用户文件（见 sw.js）。
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
    <script type="module" crossorigin src="/assets/index-Bq61oJOU.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DrLJyzb9.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
