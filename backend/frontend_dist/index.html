<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NebulaDrive</title>
    <script>
      // 防止主题闪烁：在应用挂载前根据本地存储应用主题
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : true;
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DnMdc8Wa.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CF8-pD73.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
